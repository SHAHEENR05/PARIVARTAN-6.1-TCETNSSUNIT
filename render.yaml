# Render Blueprint — deploys Parivartan as a free Static Site
services:
  - type: web
    name: parivartan-tcet-nss
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
